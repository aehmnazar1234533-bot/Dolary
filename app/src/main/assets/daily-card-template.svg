<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06142f"/><stop offset=".48" stop-color="#0a2d67"/><stop offset="1" stop-color="#020b21"/></linearGradient>
  <radialGradient id="glowTop"><stop stop-color="#1c86ff" stop-opacity=".55"/><stop offset="1" stop-color="#0877ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowBottom"><stop stop-color="#087dff" stop-opacity=".34"/><stop offset="1" stop-color="#087dff" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c4e9d" stop-opacity=".96"/><stop offset=".45" stop-color="#06265b" stop-opacity=".98"/><stop offset="1" stop-color="#031639" stop-opacity=".99"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5f5ff"/><stop offset=".25" stop-color="#3abfff"/><stop offset=".62" stop-color="#176dff"/><stop offset="1" stop-color="#8deaff"/></linearGradient>
  <linearGradient id="dollar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bff7ff" stop-opacity=".92"/><stop offset=".38" stop-color="#178cff" stop-opacity=".35"/><stop offset="1" stop-color="#0638a9" stop-opacity=".72"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0c3"/><stop offset=".55" stop-color="#c99b54"/><stop offset="1" stop-color="#7f5427"/></linearGradient>
  <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="25"/></filter>
  <pattern id="stars" width="115" height="135" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="1.7" fill="#b7eaff" opacity=".48"/><circle cx="78" cy="76" r="1.2" fill="#70bbff" opacity=".45"/><circle cx="46" cy="118" r="1" fill="#fff" opacity=".28"/></pattern>
</defs>
